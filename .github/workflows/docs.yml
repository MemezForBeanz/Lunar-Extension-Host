# Publish the docs to the repository wiki on every push to main that touches
# the documented sources, or by hand: the guides in docs/ and the API reference
# generated by LDoc (scripts/build_wiki.sh). The LDoc check runs first, so a
# docs warning fails before anything is published.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'src/lua/**'
      - 'src/c/**'
      - 'docs/**'
      - 'config.ld'
      - 'README.md'
      - 'scripts/dev.sh'
      - 'scripts/build_wiki.sh'
      - 'scripts/ldoc_wiki.lua'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write   # pushing to the wiki repository

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LUAJIT_COMMIT: 2a8e017
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential luarocks git curl ca-certificates

      # Same LuaJIT and rock tree as the CI workflow (shared cache keys).
      - name: Cache LuaJIT build
        id: luajit-cache
        uses: actions/cache@v4
        with:
          path: ~/LuaJIT
          key: luajit-${{ runner.os }}-${{ runner.arch }}-${{ env.LUAJIT_COMMIT }}

      - name: Build LuaJIT
        if: steps.luajit-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/LuaJIT/LuaJIT ~/LuaJIT
          git -C ~/LuaJIT checkout "$LUAJIT_COMMIT"
          make -C ~/LuaJIT -j"$(nproc)"

      - name: Install LuaJIT
        run: sudo make -C ~/LuaJIT install PREFIX=/usr/local

      - name: Cache rocks and downloads
        uses: actions/cache@v4
        with:
          path: |
            vendor/luarocks-tree
            vendor/.downloads
          key: deps-linux-${{ env.LUAJIT_COMMIT }}-${{ hashFiles('*.rockspec', 'scripts/dev.sh') }}

      - name: Bootstrap
        run: scripts/dev.sh bootstrap

      - name: Check the API reference
        run: scripts/dev.sh docs --check --out dist/docs

      - name: Build the wiki pages
        run: scripts/build_wiki.sh dist/wiki

      # The wiki is its own repository (<repo>.wiki.git). Generated pages replace
      # the previous ones; pages edited by hand on the wiki are left alone unless
      # this build writes a page with the same name.
      - name: Publish to the wiki
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rm -f wiki/API-*.md
          cp dist/wiki/*.md wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
          else
            git commit -q -m "Docs from ${GITHUB_SHA::7}"
            git push -q origin HEAD
            echo "Published $(ls *.md | wc -l) pages to the wiki."
          fi
